---
- name: Ensure home directory exists for user {{ ssh_keygen_ssh_user }}
  ansible.builtin.file:
    path: "/home/{{ ssh_keygen_ssh_user }}"
    state: directory
    owner: "{{ ssh_keygen_ssh_user }}"
    group: "{{ ssh_keygen_ssh_group }}"
    mode: '0700'

- name: Ensure .ssh directory exists for user {{ ssh_keygen_ssh_user }}
  ansible.builtin.file:
    path: "/home/{{ ssh_keygen_ssh_user }}/.ssh"
    state: directory
    owner: "{{ ssh_keygen_ssh_user }}"
    group: "{{ ssh_keygen_ssh_group }}"
    mode: '0700'


- name: Deploy public key to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ ssh_keygen_ssh_user }}"
    key: "{{ lookup('file', 'id_rsa.pub') }}"
    state: present
    exclusive: false
